<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop Health Monitor</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155;
    --text: #f1f5f9; --muted: #94a3b8;
    --accent: #22c55e; --accent-hover: #16a34a;
    --danger: #ef4444; --ok: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 1.15rem; }
  .logo {
    width: 36px; height: 36px; border-radius: 10px; background: var(--accent);
    display: grid; place-items: center; font-size: 1.2rem;
  }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  main { flex: 1; display: flex; justify-content: center; padding: 28px 16px; }
  .card {
    width: 100%; max-width: 820px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .card-title {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; font-size: .95rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .live { color: var(--danger); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .feed {
    position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000;
    border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
  }
  .feed img { width: 100%; height: 100%; object-fit: contain; display: block; }
  button {
    width: 100%; margin-top: 18px; padding: 15px; border: 0; border-radius: 12px;
    background: var(--accent); color: #052e16; font-size: 1.05rem; font-weight: 700;
    cursor: pointer; transition: background .15s, transform .05s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: scale(.99); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .result {
    margin-top: 18px; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border);
    display: none; align-items: center; justify-content: space-between; gap: 12px;
  }
  .result.show { display: flex; }
  .result.normal { border-color: var(--ok); background: rgba(34,197,94,.1); }
  .result.infected { border-color: var(--danger); background: rgba(239,68,68,.12); }
  .result.error { border-color: #f59e0b; background: rgba(245,158,11,.1); }
  .result h2 { font-size: 1.25rem; }
  .result p { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .badge { font-size: 1.6rem; font-weight: 700; }
  footer { text-align: center; padding: 16px; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">🌿</div>Crop Health Monitor</div>
    <div class="status"><span class="dot"></span>System Online</div>
  </header>

  <main>
    <section class="card">
      <div class="card-title"><span>Camera Feed</span><span class="live">LIVE</span></div>
      <div class="feed"><img src="{{ url_for('video_feed') }}" alt="Live camera feed"></div>

      <button id="analyzeBtn">Analyze</button>

      <div id="result" class="result">
        <div>
          <h2 id="resTitle"></h2>
          <p id="resSub"></p>
        </div>
        <div class="badge" id="resConf"></div>
      </div>
    </section>
  </main>

  <footer>Raspberry Pi · Flask · Relay on GPIO 17 (active low)</footer>

<script>
  const btn = document.getElementById("analyzeBtn");
  const box = document.getElementById("result");
  const title = document.getElementById("resTitle");
  const sub = document.getElementById("resSub");
  const conf = document.getElementById("resConf");

  function show(cls, t, s, c) {
    box.className = "result show " + cls;
    title.textContent = t; sub.textContent = s; conf.textContent = c || "";
  }

  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = "Analyzing…";
    try {
      const r = await fetch("/analyze", { method: "POST" });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Request failed");
      if (d.infected) {
        show("infected", "Infected Detected", `Relay activated for ${d.relay_seconds} seconds`, d.confidence + "%");
      } else {
        show("normal", "Normal", "No action required", d.confidence + "%");
      }
    } catch (e) {
      show("error", "Error", e.message, "");
    } finally {
      btn.disabled = false; btn.textContent = "Analyze";
    }
  });
</script>
</body>
</html>
