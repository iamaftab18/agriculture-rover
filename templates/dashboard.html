<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop Health Monitor</title>
<style>
  :root {
    --bg: #0b1220; --panel: #131c2e; --panel2: #1a2540; --border: #263352;
    --text: #eef2f9; --muted: #8b9ab8;
    --accent: #22c55e; --accent2: #16a34a; --danger: #ef4444; --warn: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #14305a55, transparent), var(--bg);
    color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; background: rgba(19,28,46,.85); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.15rem; }
  .logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg,#22c55e,#0ea5e9); display: grid; place-items: center; font-size: 1.2rem; }
  .brand small { display: block; color: var(--muted); font-weight: 400; font-size: .72rem; }
  .pill { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.bad { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(320px, 1fr); gap: 22px; padding: 24px 28px; max-width: 1400px; width: 100%; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } }
  .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .card-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .live { color: var(--danger); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .feed { position: relative; aspect-ratio: 4 / 3; background: #000; border-radius: 14px; overflow: hidden; border: 2px solid var(--border); transition: border-color .3s, box-shadow .3s; }
  .feed.normal { border-color: var(--accent); box-shadow: 0 0 24px rgba(34,197,94,.35); }
  .feed.defected { border-color: var(--danger); box-shadow: 0 0 24px rgba(239,68,68,.4); }
  .feed img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .feed .tag { position: absolute; top: 12px; left: 12px; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: .85rem; background: rgba(0,0,0,.65); display: none; }
  .feed.normal .tag { display: block; color: var(--accent); }
  .feed.defected .tag { display: block; color: var(--danger); }
  .feed.scanning::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: scan 1.1s linear infinite; }
  @keyframes scan { from { top: 0; } to { top: 100%; } }

  button { width: 100%; margin-top: 16px; padding: 16px; border: 0; border-radius: 13px; background: linear-gradient(135deg, var(--accent), #10b981); color: #04210f; font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: filter .15s, transform .05s; letter-spacing: .02em; }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:active:not(:disabled) { transform: scale(.99); }
  button:disabled { opacity: .6; cursor: not-allowed; }

  .verdict { text-align: center; padding: 22px 12px; border-radius: 14px; border: 1px dashed var(--border); background: var(--panel2); transition: all .25s; }
  .verdict .icon { font-size: 2.6rem; }
  .verdict h2 { font-size: 1.5rem; margin-top: 6px; }
  .verdict p { color: var(--muted); font-size: .88rem; margin-top: 4px; }
  .verdict.normal { border: 1px solid var(--accent); background: rgba(34,197,94,.1); }
  .verdict.defected { border: 1px solid var(--danger); background: rgba(239,68,68,.12); }
  .verdict.error { border: 1px solid var(--warn); background: rgba(245,158,11,.1); }
  .meter { height: 10px; border-radius: 99px; background: var(--panel2); margin-top: 14px; overflow: hidden; border: 1px solid var(--border); }
  .meter > div { height: 100%; width: 0; background: var(--muted); transition: width .5s, background .3s; }
  .meter-label { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 14px; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { background: var(--panel2); border: 1px solid var(--border); border-radius: 13px; padding: 12px 14px; }
  .tile .k { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
  .tile .v { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-top: 6px; font-size: 1rem; }
  .tile .v.big { font-size: 1.6rem; }
  .tile.relay-on { border-color: var(--danger); background: rgba(239,68,68,.12); }

  .history { list-style: none; max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .history li { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--border); font-size: .88rem; }
  .history .t { color: var(--muted); font-size: .78rem; }
  .history .good { color: var(--accent); font-weight: 700; }
  .history .badr { color: var(--danger); font-weight: 700; }
  .empty { color: var(--muted); font-size: .88rem; text-align: center; padding: 10px; }
  footer { text-align: center; padding: 14px; color: var(--muted); font-size: .78rem; }
</style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo">🌿</div><div>Crop Health Monitor<small>AI Agriculture Rover</small></div></div>
    <div class="pill"><span class="dot" id="sysDot"></span><span id="sysText">Connecting…</span></div>
  </header>

  <main>
    <!-- LEFT: camera + analyze -->
    <div class="col">
      <section class="card">
        <div class="card-title"><span>Camera Feed</span><span class="live">LIVE</span></div>
        <div class="feed" id="feed">
          <img src="{{ url_for('video_feed') }}" alt="Live camera feed">
          <div class="tag" id="feedTag"></div>
        </div>
        <button id="analyzeBtn">🔍 Analyze</button>
      </section>
    </div>

    <!-- RIGHT: results + status -->
    <div class="col">
      <section class="card">
        <div class="card-title"><span>Result</span><span id="lastTime">—</span></div>
        <div class="verdict" id="verdict">
          <div class="icon" id="vIcon">🌱</div>
          <h2 id="vTitle">Ready</h2>
          <p id="vSub">Press Analyze to check the crop</p>
        </div>
        <div class="meter-label"><span>Confidence</span><span id="confText">—</span></div>
        <div class="meter"><div id="confBar"></div></div>
      </section>

      <section class="card">
        <div class="card-title"><span>System Status</span><span id="uptime"></span></div>
        <div class="tiles">
          <div class="tile"><div class="k">Camera</div><div class="v"><span class="dot" id="camDot"></span><span id="camText">—</span></div></div>
          <div class="tile"><div class="k">AI Model</div><div class="v"><span class="dot" id="modelDot"></span><span id="modelText">—</span></div></div>
          <div class="tile" id="relayTile"><div class="k">Relay</div><div class="v"><span class="dot" id="relayDot"></span><span id="relayText">—</span></div></div>
          <div class="tile"><div class="k">Relay Pin</div><div class="v" id="pinText">—</div></div>
          <div class="tile"><div class="k">Normal</div><div class="v big" id="cntNormal" style="color:var(--accent)">0</div></div>
          <div class="tile"><div class="k">Defected</div><div class="v big" id="cntDef" style="color:var(--danger)">0</div></div>
        </div>
      </section>

      <section class="card">
        <div class="card-title"><span>Recent Scans</span></div>
        <ul class="history" id="history"><li class="empty">No scans yet</li></ul>
      </section>
    </div>
  </main>

  <footer>Raspberry Pi · Flask · Relay active low</footer>

<script>
  const $ = id => document.getElementById(id);
  const btn = $("analyzeBtn"), feed = $("feed");
  let counts = { normal: 0, defected: 0 }, history = [];

  function setDot(id, state) { $(id).className = "dot " + (state ? "ok" : "bad"); }

  function renderHistory() {
    const ul = $("history");
    if (!history.length) { ul.innerHTML = '<li class="empty">No scans yet</li>'; return; }
    ul.innerHTML = history.map(h =>
      `<li><span class="${h.def ? "badr" : "good"}">${h.def ? "❌ Defected" : "✅ Normal"}</span>` +
      `<span>${h.conf}%</span><span class="t">${h.time}</span></li>`).join("");
  }

  function showVerdict(cls, icon, title, sub) {
    $("verdict").className = "verdict " + cls;
    $("vIcon").textContent = icon; $("vTitle").textContent = title; $("vSub").textContent = sub;
  }

  function setConf(pct, color) {
    $("confText").textContent = pct == null ? "—" : pct + "%";
    $("confBar").style.width = (pct || 0) + "%";
    $("confBar").style.background = color || "var(--muted)";
  }

  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = "Analyzing…";
    feed.className = "feed scanning";
    try {
      const r = await fetch("/analyze", { method: "POST" });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Request failed");
      const time = new Date().toLocaleTimeString();
      $("lastTime").textContent = time;
      if (d.infected) {
        counts.defected++;
        showVerdict("defected", "⚠️", "Defected Detected", `Relay activated for ${d.relay_seconds} seconds`);
        setConf(d.confidence, "var(--danger)");
        feed.className = "feed defected"; $("feedTag").textContent = "DEFECTED " + d.confidence + "%";
      } else {
        counts.normal++;
        showVerdict("normal", "✅", "Normal", "No action required");
        setConf(d.confidence, "var(--accent)");
        feed.className = "feed normal"; $("feedTag").textContent = "NORMAL " + d.confidence + "%";
      }
      history.unshift({ def: d.infected, conf: d.confidence, time });
      history = history.slice(0, 20);
      $("cntNormal").textContent = counts.normal; $("cntDef").textContent = counts.defected;
      renderHistory(); refreshStatus();
    } catch (e) {
      feed.className = "feed";
      showVerdict("error", "⚠️", "Error", e.message); setConf(null);
    } finally {
      btn.disabled = false; btn.textContent = "🔍 Analyze";
    }
  });

  function fmtUp(s) {
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    return "Uptime " + (h ? h + "h " : "") + m + "m";
  }

  async function refreshStatus() {
    try {
      const d = await (await fetch("/status")).json();
      setDot("camDot", d.camera_ok); $("camText").textContent = d.camera_ok ? "Connected" : "Not found";
      setDot("modelDot", d.model_ok); $("modelText").textContent = d.model_ok ? "Loaded" : "Error";
      setDot("relayDot", !d.relay_on); $("relayText").textContent = d.relay_on ? "ACTIVE" : "Idle";
      $("relayTile").className = "tile" + (d.relay_on ? " relay-on" : "");
      $("pinText").textContent = "GPIO " + d.relay_pin;
      $("uptime").textContent = fmtUp(d.uptime);
      const ok = d.camera_ok && d.model_ok;
      setDot("sysDot", ok); $("sysText").textContent = ok ? "System Online" : "Check camera / model";
    } catch (e) {
      setDot("sysDot", false); $("sysText").textContent = "Offline";
    }
  }
  refreshStatus(); setInterval(refreshStatus, 2000);
</script>
</body>
</html>
